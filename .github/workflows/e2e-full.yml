name: Full E2E Suite

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "并行 worker 数量"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      skip_visual:
        description: "跳过视觉回归测试"
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: Full E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Seed test data
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python scripts/seed.py --reset

      - name: Start backend server
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          DEBUG: "false"
          APP_ENV: testing
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # 带重试的健康检查（最多等待 30 秒）
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/15)"
            sleep 2
          done
          echo "❌ Backend failed to start"
          exit 1

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start frontend preview server
        run: |
          cd frontend
          npx vite preview --port 5173 --host 0.0.0.0 &
          sleep 3

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run full E2E test suite
        env:
          API_BASE_URL: http://localhost:8000
          PLAYWRIGHT_WORKERS: ${{ inputs.workers }}
        run: |
          cd frontend
          if [ "${{ inputs.skip_visual }}" = "true" ]; then
            echo "🚀 Running E2E tests (excluding visual regression) with ${{ inputs.workers }} workers"
            npx playwright test --project=chromium --workers=${{ inputs.workers }} --grep-invert="视觉回归" --reporter=list,html
          else
            echo "🚀 Running full E2E tests (including visual regression) with ${{ inputs.workers }} workers"
            npx playwright test --project=chromium --workers=${{ inputs.workers }} --reporter=list,html
          fi

      - name: Upload full E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report
          path: frontend/tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload E2E test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-failures
          path: frontend/tests/e2e/test-results/
          retention-days: 7

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [e2e-full]
    if: failure()

    steps:
      - name: Create summary
        run: |
          echo "## ❌ Full E2E 测试失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请查看 [完整报告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 测试分层说明" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier 1 (Smoke, @smoke)**: PR CI 中运行 — ~68 用例" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier 2 (Extended)**: 手动触发 — 功能性 E2E 测试, ~229 用例" >> $GITHUB_STEP_SUMMARY
          echo "- **Tier 3 (Visual Regression)**: 手动触发（可选） — 视觉回归, ~22 用例" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Integration**: 手动触发 — API 集成测试, ~186 用例" >> $GITHUB_STEP_SUMMARY
