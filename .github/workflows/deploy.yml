name: Deploy

on:
  # 仅手动触发部署
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      version:
        description: "部署版本 (默认使用 commit SHA)"
        required: false
        type: string

# 允许写入packages权限（GHCR推送需要）
permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DEPLOY_DIR: "~/Documents/github/customer_platform_vk"

jobs:
  # ============================================================
  # 构建并推送镜像
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./deploy/docker/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/frontend.Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}-frontend:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}-frontend:buildcache,mode=max

  # ============================================================
  # 部署到 Staging 环境
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' }}
    environment:
      name: staging
      url: https://staging.jiazoushi.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Deploy to staging server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.STAGING_WEBHOOK_SECRET }}
          EXTERNAL_MYSQL_URL: ${{ secrets.STAGING_EXTERNAL_MYSQL_URL }}
          HEALTH_URL: "http://localhost:8082/health"
        run: |
          echo "🚀 部署到 Staging 环境..."
          echo "镜像标签: ${IMAGE_TAG}"

          # 设置 SSH 密钥
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          # 部署脚本（不使用 heredoc 避免缩进问题，通过 printf 管道传递）
          DEPLOY_SCRIPT='cd "${DEPLOY_DIR}" && git fetch origin main && git reset --hard origin/main && ./deploy/scripts/deploy.sh --use-remote-image "${IMAGE_TAG}"'
          export DEPLOY_SCRIPT

          # 通过 Cloudflare Tunnel 远程执行部署
          # 重试机制: Cloudflare Tunnel 偶发 websocket bad handshake，最多重试 3 次
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "📋 部署尝试 ${RETRY_COUNT}/${MAX_RETRIES}..."

            if printf '%s\n' "$DEPLOY_SCRIPT" | ssh -i ~/.ssh/staging_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=60 \
                -o ProxyCommand="cloudflared access ssh --hostname ${SSH_HOST}" \
                ${SSH_USER}@${SSH_HOST} \
                IMAGE_TAG="${IMAGE_TAG}" \
                GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
                DB_USER="${DB_USER}" \
                DB_PASSWORD="${DB_PASSWORD}" \
                JWT_SECRET="${JWT_SECRET}" \
                WEBHOOK_SECRET="${WEBHOOK_SECRET}" \
                EXTERNAL_MYSQL_URL="${EXTERNAL_MYSQL_URL}" \
                HEALTH_URL="${HEALTH_URL}" \
                DEPLOY_DIR="${DEPLOY_DIR}" \
                'bash -s'; then
              echo "✅ Staging 部署完成"
              exit 0
            fi

            echo "⚠️ 部署尝试 ${RETRY_COUNT} 失败 (exit code: $?)"
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ 等待 15 秒后重试..."
              sleep 15
            fi
          done

          echo "❌ 部署失败: 已重试 ${MAX_RETRIES} 次仍无法连接到 Staging 服务器"
          echo "💡 可能原因: Staging 服务器离线、cloudflared tunnel 未运行、或 Cloudflare Access 配置变更"
          exit 1

  # ============================================================
  # 部署到 Production 环境 (需要手动审批)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    environment:
      name: production
      url: https://production.jiazoushi.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Deploy to production server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.PRODUCTION_WEBHOOK_SECRET }}
          EXTERNAL_MYSQL_URL: ${{ secrets.PRODUCTION_EXTERNAL_MYSQL_URL }}
          HEALTH_URL: "http://localhost:8082/health"
        run: |
          echo "🚀 部署到 Production 环境..."
          echo "镜像标签: ${IMAGE_TAG}"

          # 设置 SSH 密钥
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key

          # 部署脚本（不使用 heredoc 避免缩进问题，通过 printf 管道传递）
          DEPLOY_SCRIPT='cd "${DEPLOY_DIR}" && git fetch origin main && git reset --hard origin/main && ./deploy/scripts/deploy.sh --use-remote-image "${IMAGE_TAG}"'
          export DEPLOY_SCRIPT

          # 通过 Cloudflare Tunnel 远程执行部署
          # 重试机制: Cloudflare Tunnel 偶发 websocket bad handshake，最多重试 3 次
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "📋 部署尝试 ${RETRY_COUNT}/${MAX_RETRIES}..."

            if printf '%s\n' "$DEPLOY_SCRIPT" | ssh -i ~/.ssh/production_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=60 \
                -o ProxyCommand="cloudflared access ssh --hostname ${SSH_HOST}" \
                ${SSH_USER}@${SSH_HOST} \
                IMAGE_TAG="${IMAGE_TAG}" \
                GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
                DB_USER="${DB_USER}" \
                DB_PASSWORD="${DB_PASSWORD}" \
                JWT_SECRET="${JWT_SECRET}" \
                WEBHOOK_SECRET="${WEBHOOK_SECRET}" \
                EXTERNAL_MYSQL_URL="${EXTERNAL_MYSQL_URL}" \
                HEALTH_URL="${HEALTH_URL}" \
                DEPLOY_DIR="${DEPLOY_DIR}" \
                'bash -s'; then
              echo "✅ Production 部署完成"
              exit 0
            fi

            echo "⚠️ 部署尝试 ${RETRY_COUNT} 失败 (exit code: $?)"
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ 等待 15 秒后重试..."
              sleep 15
            fi
          done

          echo "❌ 部署失败: 已重试 ${MAX_RETRIES} 次仍无法连接到 Production 服务器"
          echo "💡 可能原因: Production 服务器离线、cloudflared tunnel 未运行、或 Cloudflare Access 配置变更"
          exit 1

  # ============================================================
  # 部署后健康检查
  # ============================================================
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: Run health check
        run: |
          echo "🔍 执行健康检查..."

          # 根据部署的环境选择检查 URL
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            HEALTH_URL="https://staging.jiazoushi.com/health"
          else
            HEALTH_URL="https://production.jiazoushi.com/health"
          fi

          echo "检查地址: ${HEALTH_URL}"

          response=$(curl -s -o /dev/null -w "%{http_code}" ${HEALTH_URL})
          if [ "$response" == "200" ]; then
            echo "✅ 健康检查通过"
          else
            echo "❌ 健康检查失败 (HTTP ${response})"
            exit 1
          fi
