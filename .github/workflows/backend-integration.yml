name: Backend Integration Tests

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true

# 说明：完整集成套件也可通过 workflow_dispatch 手动触发（含全部 ~186 用例）。
# PR 门禁（pr-checks.yml）已包含同一套集成测试，合并前自动运行。

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
        run: |
          cd backend
          pytest tests/integration/ -n 1 --timeout=120 --cov=app --cov-report=term-missing --junitxml=junit.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-junit
          path: backend/junit.xml
          retention-days: 14

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend-integration-tests]
    if: failure()

    steps:
      - name: Create summary
        run: |
          {
            echo "## ❌ Backend Integration 测试失败"
            echo ""
            echo "请查看 [完整报告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "### 测试说明"
            echo "- **Backend Integration**: ~186 用例，覆盖 API 集成测试"
            echo "- PR CI 中单元测试与集成测试均自动运行（见 pr-checks.yml）；此工作流用于按需手动触发完整套件"
          } >> "$GITHUB_STEP_SUMMARY"
