name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# 说明（2026-09-21）：
#   lint / 类型检查 / 单元测试 / 集成测试 / E2E smoke 均由 PR 门禁
#   （pr-checks.yml）在合并前执行。本 workflow 只做 main 上的
#   「可构建 + 可启动」回归守护，避免与 PR 门禁重复消耗 CI 时间
#   （原 backend-test / frontend-check 与 PR 门禁的检查项完全重叠）。
# ============================================================
jobs:
  # ============================================================
  # 后端：依赖可安装 + 应用可导入（捕获 main 上不可启动的回归）
  # ============================================================
  backend-smoke:
    name: Backend Smoke (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import app（验证依赖与配置可加载）
        run: |
          cd backend
          python -c "from app.main import app; print('✅ app 可导入，路由数:', len(app.router.routes))"

  # ============================================================
  # 前端：可构建
  # ============================================================
  frontend-build:
    name: Frontend Build (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

  # ============================================================
  # main 回归守护汇总
  # ============================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend-build]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend Smoke:  ${{ needs.backend-smoke.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"

          if [ "${{ needs.backend-smoke.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            exit 1
          fi

          echo "✅ main 回归守护通过（lint / 类型检查 / 单测 / E2E 由 PR 门禁覆盖）"
