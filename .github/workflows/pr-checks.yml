name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 快速检查 - 代码格式 + Lint (无数据库依赖)
  # ============================================================
  quick-checks:
    name: Quick Checks (Lint + Format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Python linting and formatting (ruff)
        run: |
          cd backend
          ruff check app/ tests/
          ruff format app/ tests/ --check

      - name: Frontend linting
        run: |
          cd frontend
          npm run lint

      - name: Frontend type check
        run: |
          cd frontend
          npx vue-tsc --noEmit

      - name: Frontend unit tests
        run: |
          cd frontend
          npx vitest run --reporter=verbose

  # ============================================================
  # 后端单元测试 (无数据库依赖, 快速运行)
  # ============================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        env:
          JWT_SECRET: test-secret-key-for-ci
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: |
          cd backend
          pytest tests/unit/ -n auto --cov=app --cov-report=term-missing --cov-fail-under=25 --junitxml=junit.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-backend-junit
          path: backend/junit.xml
          retention-days: 3

  # ============================================================
  # 后端集成测试 (真实 Postgres + Redis, 迁移 + 全链路)
  # 覆盖 billing 等核心链的数据库事务路径: 行级锁/重试/迁移升级/失败恢复
  # ============================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Seed test data
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python scripts/seed.py --reset

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
        run: |
          cd backend
          pytest tests/integration/ -n 1 --timeout=120 --cov=app --cov-report=term-missing --junitxml=junit.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-backend-integration-junit
          path: backend/junit.xml
          retention-days: 14

  # ============================================================
  # 前端构建
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ============================================================
  # E2E 测试 (Playwright)
  # ============================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Seed test data
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        run: |
          cd backend
          python scripts/seed.py --reset

      - name: Start backend server
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          DEBUG: "false"
          APP_ENV: testing
        run: |
          cd backend
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # 带重试的健康检查（最多等待 30 秒）
          for i in $(seq 1 15); do
            if curl -s http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/15)"
            sleep 2
          done
          echo "❌ Backend failed to start"
          exit 1

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start frontend preview server
        run: |
          cd frontend
          npx vite preview --port 5173 --host 0.0.0.0 &
          sleep 3

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run E2E tests (smoke suite only)
        env:
          API_BASE_URL: http://localhost:8000
        run: |
          cd frontend
          npx playwright test --project=chromium --grep="@smoke" --reporter=list

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-smoke-results
          path: frontend/tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-e2e-smoke-failures
          path: frontend/tests/e2e/test-results/
          retention-days: 3

  # ============================================================
  # 迁移变更门禁: Alembic 迁移必须有对应测试才能合并
  # 检测 backend/alembic/versions/ 变更, 若变更则要求测试文件存在
  # ============================================================
  migration-gate:
    name: Migration Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'backend/alembic/versions/*.py'
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          list-files: json

      - name: Check migration test exists
        if: steps.changes.outputs.migrations == 'true'
        shell: bash
        run: |
          echo "检测到 Alembic 迁移变更:"
          echo "${{ steps.changes.outputs.migrations_files }}"
          echo ""

          # 迁移变更必须伴随测试文件（覆盖 upgrade/downgrade 数据语义）
          if ls backend/tests/**/test_*migration*.py >/dev/null 2>&1 || \
             ls backend/tests/**/test_migrations.py >/dev/null 2>&1; then
            echo "✅ 迁移测试文件存在"
          else
            echo "❌ 迁移变更缺少对应测试: 请为迁移添加 upgrade/downgrade 测试"
            echo "   参考: backend/tests/integration/test_migrations.py"
            exit 1
          fi

      - name: Verify migration chain integrity
        if: steps.changes.outputs.migrations == 'true'
        run: |
          python -m pip install -r backend/requirements.txt --quiet
          cd backend
          # 迁移链必须只有单一 head（无分叉）
          HEADS=$(python -m alembic heads 2>/dev/null | wc -l | tr -d ' ')
          echo "Alembic heads: $HEADS"
          if [ "$HEADS" != "1" ]; then
            echo "❌ 迁移链存在分叉: 期望单一 head，实际 $HEADS 个"
            python -m alembic heads
            exit 1
          fi
          echo "✅ 迁移链完整（单一 head）"

  # ============================================================
  # PR 质量门禁
  # ============================================================
  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [quick-checks, backend-tests, backend-integration-tests, migration-gate, frontend-build, e2e-tests]
    if: always()

    steps:
      - name: Check all jobs passed
        id: check
        run: |
          echo "========================================="
          echo "PR Quality Gate Results"
          echo "========================================="
          echo "Quick Checks:    ${{ needs.quick-checks.result }}"
          echo "Backend Tests:   ${{ needs.backend-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Migration Gate:  ${{ needs.migration-gate.result }}"
          echo "Frontend Build:  ${{ needs.frontend-build.result }}"
          echo "E2E Tests:       ${{ needs.e2e-tests.result }}"
          echo "========================================="

          # E2E 测试当前为非阻塞（已知失败用例，待 TD-012 修复后改为阻塞）
          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-integration-tests.result }}" != "success" ] || \
             [ "${{ needs.migration-gate.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "❌ PR quality gate failed"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "⚠️  E2E smoke tests have failures (non-blocking, tracked in TD-012)"
            echo "   Full E2E suite runs nightly — see e2e-nightly.yml"
          fi

          echo "ℹ️  Backend integration tests run in PR checks with real Postgres + Redis"
          echo "   Unit tests (360) + Integration tests (~186) both run before merge"

          echo "✅ All PR quality checks passed"
          echo "result=passed" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 验收记录：把本次 PR 的质量门禁结论写入 STEP_SUMMARY 并上传，
      # 使验收结论随运行落盘、仓库内可复核（对应可靠交付验收证据）。
      # ------------------------------------------------------------
      - name: Write acceptance record
        id: acceptance
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SHA: ${{ github.sha }}
          GATE_RESULT: ${{ steps.check.outputs.result }}
        run: |
          RECORD_FILE="${RUNNER_TEMP:-/tmp}/pr-acceptance-summary.md"
          {
            echo "## PR 质量门禁验收记录"
            echo ""
            echo "- PR: ${PR_NUMBER} (${PR_TITLE})"
            echo "- 提交: ${COMMIT_SHA}"
            echo "- 结论: ${GATE_RESULT}"
            echo "- 时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| 检查 | 结果 |"
            echo "|---|---|"
            echo "| Quick Checks | ${{ needs.quick-checks.result }} |"
            echo "| Backend Tests | ${{ needs.backend-tests.result }} |"
            echo "| Backend Integration Tests | ${{ needs.backend-integration-tests.result }} |"
            echo "| Migration Gate | ${{ needs.migration-gate.result }} |"
            echo "| Frontend Build | ${{ needs.frontend-build.result }} |"
            echo "| E2E Tests | ${{ needs.e2e-tests.result }} |"
          } | tee "$RECORD_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "record_file=$RECORD_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-acceptance-record
          path: ${{ steps.acceptance.outputs.record_file }}
          retention-days: 30
          if-no-files-found: warn
