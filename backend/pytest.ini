[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 开发环境默认选项（快速运行，不收集覆盖率）
# --import-mode=importlib：tests/ 下存在跨目录同名测试文件（tests/test_analytics_service.py 与
# tests/unit/services/test_analytics_service.py 等），默认的 prepend 模式按 basename 注册模块，
# 会触发 "import file mismatch" 收集中断；importlib 按文件路径注册，且与 pytest-xdist 兼容。
addopts = -v --tb=short --import-mode=importlib
norecursedirs = performance  # Performance tests use locust/gevent (incompatible with pytest-xdist)

# 注册自定义 markers
markers =
    xdist_group: Group tests to run in the same xdist worker (prevents DB conflicts)
    smoke: 核心业务链测试（结算事务/余额扣款/状态流转/迁移），PR 门禁快速子集
    full: 完整集成测试（未标 smoke 的全部；由 nightly/合入前全量 job 执行）

# CI 环境通过命令行额外参数覆盖（见 .github/workflows/pr-checks.yml）：
#   PR 门禁：unit job 单独判定覆盖率 ≥34%（当前实际 34.67%，--cov-fail-under=34）
#   全量门禁：backend-integration-full（nightly/manual）先跑 unit 产 .coverage，
#             再跑全量 integration 以 --cov-append 合并，判定「单元+集成」≥50%

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
